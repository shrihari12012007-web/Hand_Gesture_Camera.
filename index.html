<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Hand Gesture Camera Demo</title>
  
  <!-- MediaPipe CDN scripts for browser hand tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; margin-top: 0; }
    .container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #input_video {
      display: none; /* hidden; canvas draws mirrored feed */
    }
    #output_canvas {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      transform: scaleX(-1); /* mirror video */
    }
    .status-box {
      margin: 15px auto;
      padding: 12px;
      max-width: 400px;
      background: #1e293b;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #4ade80;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Live Hand Gesture Camera</h1>
  <p>Allow camera access in your browser to test live hand detection</p>

  <div class="status-box" id="gesture_status">Detecting Hands...</div>

  <div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas" width="1280" height="720"></canvas>
  </div>

  <br>
  <a class="btn" href="https://github.com/shrihari12012007-web/Hand_Gesture_Camera.">View Full Python Code on GitHub</a>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('gesture_status');

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
          drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 4});

          // Basic Finger Up/Down detection
          const indexUp = landmarks[8].y < landmarks[6].y;
          const middleUp = landmarks[12].y < landmarks[10].y;
          const ringUp = landmarks[16].y < landmarks[14].y;
          const pinkyUp = landmarks[20].y < landmarks[18].y;

          if (indexUp && !middleUp && !ringUp && !pinkyUp) {
            statusText.innerText = "Gesture Detected: INDEX FINGER (Mouse Move)";
          } else if (middleUp && !indexUp && !ringUp && !pinkyUp) {
            statusText.innerText = "Gesture Detected: MIDDLE FINGER (Screenshot)";
          } else if (pinkyUp && !indexUp && !middleUp && !ringUp) {
            statusText.innerText = "Gesture Detected: PINKY FINGER (Search)";
          } else if (indexUp && middleUp && !ringUp && !pinkyUp) {
            statusText.innerText = "Gesture Detected: 2 FINGERS (Volume Up)";
          } else if (indexUp && middleUp && ringUp && pinkyUp) {
            statusText.innerText = "Gesture Detected: 4 FINGERS / PALM (Desktop Switch)";
          } else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
            statusText.innerText = "Gesture Detected: FIST (Volume Down)";
          } else {
            statusText.innerText = "Hands Tracking Active";
          }
        }
      } else {
        statusText.innerText = "No Hand Detected - Show Hand to Camera";
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Hand Gesture Showcase</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; margin-top: 0; }
    
    .status-bar {
      margin: 12px auto;
      padding: 12px 24px;
      max-width: 500px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #4ade80;
    }

    .main-stage {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #38bdf8;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #input_video { display: none; }
    #output_canvas {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      transform: scaleX(-1);
    }

    /* Virtual In-Browser Elements */
    #virtual_cursor {
      position: absolute;
      width: 22px;
      height: 22px;
      background: rgba(56, 189, 248, 0.8);
      border: 2px solid #ffffff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      transition: width 0.1s, height 0.1s;
      z-index: 10;
    }
    #virtual_cursor.clicking {
      background: rgba(239, 68, 68, 0.9);
      width: 32px;
      height: 32px;
    }

    /* Interactive Volume Demo */
    .controls-demo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 15px auto;
      max-width: 450px;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 8px;
    }
    progress {
      width: 200px;
      height: 16px;
      accent-color: #38bdf8;
    }

    .gallery {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .gallery img {
      width: 120px;
      border-radius: 6px;
      border: 2px solid #38bdf8;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Interactive Hand Gesture Controller</h1>
  <p>Test live gestures and virtual controls directly in your browser</p>

  <div class="status-bar" id="status">Loading AI Hand Detector...</div>

  <div class="main-stage" id="stage">
    <div id="virtual_cursor"></div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas" width="1280" height="720"></canvas>
  </div>

  <div class="controls-demo">
    <span>🔊 <b>Simulated Volume:</b></span>
    <progress id="vol_bar" value="50" max="100"></progress>
    <span id="vol_val">50%</span>
  </div>

  <div class="gallery" id="screenshot_gallery"></div>

  <br>
  <a class="btn" href="https://github.com/shrihari12012007-web/Hand_Gesture_Camera.">View Source on GitHub</a>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const cursor = document.getElementById('virtual_cursor');
    const stage = document.getElementById('stage');
    const volBar = document.getElementById('vol_bar');
    const volVal = document.getElementById('vol_val');
    const gallery = document.getElementById('screenshot_gallery');

    let currentVol = 50;
    let lastSnap = 0;

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF66', lineWidth: 4});
        drawLandmarks(canvasCtx, landmarks, {color: '#FF0033', lineWidth: 2, radius: 4});

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // Move Virtual Cursor inside browser frame
        const stageRect = stage.getBoundingClientRect();
        const cursorX = (1 - indexTip.x) * stageRect.width; // Mirrored
        const cursorY = indexTip.y * stageRect.height;
        cursor.style.display = 'block';
        cursor.style.left = `${cursorX}px`;
        cursor.style.top = `${cursorY}px`;

        // Finger States
        const indexUp = landmarks[8].y < landmarks[6].y;
        const middleUp = landmarks[12].y < landmarks[10].y;
        const ringUp = landmarks[16].y < landmarks[14].y;
        const pinkyUp = landmarks[20].y < landmarks[18].y;

        // Pinch Calculation
        const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        const isPinch = dist < 0.06;

        const now = Date.now();

        if (isPinch) {
          statusText.innerText = "🤏 PINCH: Virtual Click Triggered!";
          cursor.classList.add('clicking');
        } else {
          cursor.classList.remove('clicking');

          if (middleUp && !indexUp && !ringUp && !pinkyUp) {
            statusText.innerText = "📸 MIDDLE FINGER: Browser Screenshot Captured!";
            if (now - lastSnap > 2000) {
              captureBrowserSnap();
              lastSnap = now;
            }
          } else if (pinkyUp && !indexUp && !middleUp && !ringUp) {
            statusText.innerText = "🔍 PINKY: Open System Search";
          } else if (indexUp && middleUp && !ringUp && !pinkyUp) {
            statusText.innerText = "✌️ 2 FINGERS: Increasing Volume (+)";
            currentVol = Math.min(100, currentVol + 1);
            updateVolume();
          } else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
            statusText.innerText = "✊ FIST: Decreasing Volume (-)";
            currentVol = Math.max(0, currentVol - 1);
            updateVolume();
          } else if (indexUp && middleUp && ringUp && pinkyUp) {
            statusText.innerText = "🖐️ PALM / 4 FINGERS: Switch Desktop";
          } else if (indexUp) {
            statusText.innerText = "☝️ INDEX: Moving Virtual Cursor";
          }
        }
      } else {
        cursor.style.display = 'none';
        statusText.innerText = "Show your hand to the camera to interact";
      }
      canvasCtx.restore();
    }

    function updateVolume() {
      volBar.value = currentVol;
      volVal.innerText = `${currentVol}%`;
    }

    function captureBrowserSnap() {
      const snapUrl = canvasElement.toDataURL('image/png');
      const img = document.createElement('img');
      img.src = snapUrl;
      img.title = "Gesture Screenshot";
      gallery.prepend(img);
      if (gallery.children.length > 3) {
        gallery.removeChild(gallery.lastChild);
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });

    camera.start().then(() => {
      statusText.innerText = "Ready! Place hand in view.";
    });
  </script>
</body>
</html>

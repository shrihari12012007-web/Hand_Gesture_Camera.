<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Hand Gesture Controller</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px 20px; text-align: center; }
    .card { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 10px; }
    p { line-height: 1.6; color: #cbd5e1; }
    .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #38bdf8; color: #0f172a; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .btn:hover { background: #0284c7; color: #fff; }
    ul { text-align: left; margin: 20px 0; color: #e2e8f0; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hand Gesture Controller</h1>
    <p>A touchless desktop controller built with Python, OpenCV, and MediaPipe.</p>
    <ul>
      <li>☝️ <b>Index Finger:</b> Move Mouse Cursor</li>
      <li>🤏 <b>Pinch:</b> Left Click</li>
      <li>🖐️ <b>Palm Swipe:</b> Switch Desktops / Workspaces</li>
      <li>📸 <b> Finger:</b> Take Screenshot</li>
      <li>🔍 <b>Pinky:</b> System Search</li>
    </ul>
    <a class="btn" href="https://github.com/shrihari12012007-web/Hand_Gesture_Camera..">View Code on GitHub</a>
  </div>
</body>
</html>
